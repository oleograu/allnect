<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha Rede - Preview Interativo</title>
  <style>
    :root {
      --bg: #eef3f7;
      --bg-strong: #dfe8f2;
      --card: rgba(255, 255, 255, 0.9);
      --card-solid: #ffffff;
      --text: #162235;
      --muted: #637086;
      --line: rgba(102, 125, 156, 0.18);
      --brand: #ff6f61;
      --brand-dark: #ef5b4d;
      --blue: #2d6cdf;
      --blue-dark: #1f57ba;
      --green: #18936d;
      --gold: #f4b942;
      --shadow: 0 22px 44px rgba(25, 42, 70, 0.12);
      --soft-shadow: 0 14px 30px rgba(25, 42, 70, 0.08);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255, 111, 97, 0.18), transparent 26%),
        radial-gradient(circle at top right, rgba(45, 108, 223, 0.2), transparent 30%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
    }

    body[data-theme="blackout"] {
      --bg: #0b1016;
      --bg-strong: #111824;
      --card: rgba(16, 22, 32, 0.9);
      --card-solid: #141b26;
      --text: #edf3ff;
      --muted: #9caec7;
      --line: rgba(133, 153, 186, 0.2);
      --shadow: 0 24px 48px rgba(2, 6, 12, 0.42);
      --soft-shadow: 0 14px 30px rgba(2, 6, 12, 0.28);
      background:
        radial-gradient(circle at top left, rgba(255, 111, 97, 0.12), transparent 22%),
        radial-gradient(circle at top right, rgba(45, 108, 223, 0.16), transparent 28%),
        linear-gradient(180deg, #0a0f15 0%, #0f1722 100%);
    }

    body[data-theme="blackout"] .topbar,
    body[data-theme="blackout"] .search-box,
    body[data-theme="blackout"] .search-result-item,
    body[data-theme="blackout"] .composer-form textarea,
    body[data-theme="blackout"] .inline-input,
    body[data-theme="blackout"] .inline-textarea,
    body[data-theme="blackout"] .story,
    body[data-theme="blackout"] .post-card,
    body[data-theme="blackout"] .product-card,
    body[data-theme="blackout"] .friend-card,
    body[data-theme="blackout"] .notification-item,
    body[data-theme="blackout"] .chat-person,
    body[data-theme="blackout"] .chat-message,
    body[data-theme="blackout"] .chat-form,
    body[data-theme="blackout"] .chat-sidebar,
    body[data-theme="blackout"] .chat-main,
    body[data-theme="blackout"] .chat-search,
    body[data-theme="blackout"] .drawer,
    body[data-theme="blackout"] .chat-drawer,
    body[data-theme="blackout"] .modal,
    body[data-theme="blackout"] .profile-kpi,
    body[data-theme="blackout"] .profile-list-item,
    body[data-theme="blackout"] .detail-item,
    body[data-theme="blackout"] .switch-row,
    body[data-theme="blackout"] .admin-stat-card,
    body[data-theme="blackout"] .reel-side-card,
    body[data-theme="blackout"] .chat-emoji-panel {
      background: rgba(16, 22, 32, 0.96);
      border-color: rgba(133, 153, 186, 0.18);
      color: var(--text);
    }

    body[data-theme="blackout"] .card,
    body[data-theme="blackout"] .search-group,
    body[data-theme="blackout"] .profile-section,
    body[data-theme="blackout"] .comment-item,
    body[data-theme="blackout"] .profile-stat,
    body[data-theme="blackout"] .trending-item,
    body[data-theme="blackout"] .marketplace-page-hero,
    body[data-theme="blackout"] .marketplace-sidebar-panel,
    body[data-theme="blackout"] .marketplace-main-panel,
    body[data-theme="blackout"] .marketplace-page-card,
    body[data-theme="blackout"] .marketplace-hero-stat,
    body[data-theme="blackout"] .marketplace-highlight,
    body[data-theme="blackout"] .marketplace-empty {
      background: rgba(16, 22, 32, 0.9);
      border-color: rgba(133, 153, 186, 0.18);
    }

    body[data-theme="blackout"] .button-outline,
    body[data-theme="blackout"] .button-soft,
    body[data-theme="blackout"] .chip,
    body[data-theme="blackout"] .action-button,
    body[data-theme="blackout"] .composer-tool,
    body[data-theme="blackout"] .marketplace-chip,
    body[data-theme="blackout"] .chat-icon-button,
    body[data-theme="blackout"] .chat-emoji-button,
    body[data-theme="blackout"] .chat-emoji-option,
    body[data-theme="blackout"] .reaction-option {
      background: rgba(29, 40, 58, 0.92);
      border-color: rgba(133, 153, 186, 0.18);
      color: var(--text);
    }

    body[data-theme="blackout"] .nav-pill {
      background: rgba(var(--nav-rgb, 45, 108, 223), 0.12);
      border-color: rgba(var(--nav-rgb, 45, 108, 223), 0.2);
      color: var(--nav-accent, #8fb8ff);
      box-shadow: 0 10px 22px rgba(5, 10, 18, 0.22);
    }

    body[data-theme="blackout"] .nav-pill:hover,
    body[data-theme="blackout"] .nav-pill[data-active="true"],
    body[data-theme="blackout"] .button-soft:hover,
    body[data-theme="blackout"] .button-outline:hover,
    body[data-theme="blackout"] .action-button:hover,
    body[data-theme="blackout"] .composer-tool[data-active="true"],
    body[data-theme="blackout"] .chip[data-active="true"],
    body[data-theme="blackout"] .chat-tab[data-active="true"] {
      background: rgba(var(--nav-rgb, 45, 108, 223), 0.22);
      border-color: rgba(var(--nav-rgb, 45, 108, 223), 0.36);
      color: #f5f8ff;
    }

    body[data-theme="blackout"] .reaction-bar,
    body[data-theme="blackout"] .chat-shell,
    body[data-theme="blackout"] .chat-tabs,
    body[data-theme="blackout"] .chat-messages,
    body[data-theme="blackout"] .profile-banner,
    body[data-theme="blackout"] .story-banner,
    body[data-theme="blackout"] .product-preview,
    body[data-theme="blackout"] .profile-cover,
    body[data-theme="blackout"] .post-image,
    body[data-theme="blackout"] .product-card img {
      background: linear-gradient(135deg, rgba(19, 28, 42, 0.98), rgba(26, 38, 56, 0.96));
      border-color: rgba(133, 153, 186, 0.18);
    }

    body[data-theme="blackout"] .chat-tab {
      background: rgba(20, 28, 40, 0.9);
      border-color: rgba(133, 153, 186, 0.16);
    }

    body[data-theme="blackout"] .chat-search-input {
      background: transparent;
      color: var(--text);
    }

    body[data-theme="blackout"] .marketplace-toolbar select {
      background: rgba(29, 40, 58, 0.92);
      border-color: rgba(133, 153, 186, 0.18);
      color: var(--text);
    }

    body[data-theme="blackout"] .chat-search-icon,
    body[data-theme="blackout"] .chat-message-status {
      color: #9dc0ff;
    }

    body[data-theme="blackout"] .chat-tab p,
    body[data-theme="blackout"] .post-time,
    body[data-theme="blackout"] .post-stats,
    body[data-theme="blackout"] .reaction-note,
    body[data-theme="blackout"] .empty-card,
    body[data-theme="blackout"] .admin-stat-card span {
      color: var(--muted);
    }

    body[data-theme="blackout"] .post-tag {
      background: rgba(29, 40, 58, 0.94);
      color: #bcd4ff;
    }

    body[data-theme="blackout"] .search-icon {
      background: rgba(45, 108, 223, 0.18);
      color: #8fb8ff;
    }

    body[data-theme="blackout"] .story.story-create {
      background:
        linear-gradient(180deg, rgba(45, 108, 223, 0.12), rgba(255, 111, 97, 0.12)),
        rgba(16, 22, 32, 0.96);
      border-color: rgba(72, 124, 218, 0.3);
    }

    body[data-theme="blackout"] .story-create-badge {
      border-color: rgba(16, 22, 32, 0.96);
    }

    body[data-theme="blackout"] .detail-item a {
      color: #9dc0ff;
    }

    body[data-theme="blackout"] .small-copy,
    body[data-theme="blackout"] .search-result-item p,
    body[data-theme="blackout"] .story-meta,
    body[data-theme="blackout"] .story-status-preview,
    body[data-theme="blackout"] .product-meta,
    body[data-theme="blackout"] .friend-subtitle,
    body[data-theme="blackout"] .trending-item p,
    body[data-theme="blackout"] .profile-summary p,
    body[data-theme="blackout"] .detail-item span,
    body[data-theme="blackout"] .switch-row span,
    body[data-theme="blackout"] .notification-time,
    body[data-theme="blackout"] .chat-person p,
    body[data-theme="blackout"] .comment-item span {
      color: var(--muted);
    }

    body[data-theme="blackout"] .trending-item:hover {
      background: rgba(29, 40, 58, 0.94);
      border-color: rgba(45, 108, 223, 0.3);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      background: none;
      cursor: pointer;
      color: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .hidden {
      display: none !important;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(16px);
      background: rgba(248, 251, 255, 0.9);
      border-bottom: 1px solid rgba(112, 137, 170, 0.18);
    }

    .topbar-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 18px 18px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-mark {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--brand), #f7a44c);
      box-shadow: 0 12px 26px rgba(255, 111, 97, 0.28);
    }

    button.brand-mark {
      padding: 0;
      flex-shrink: 0;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(112, 137, 170, 0.18);
      border-radius: 999px;
      box-shadow: var(--soft-shadow);
      flex: 1 1 auto;
      min-width: 0;
    }

    .search-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--blue);
      background: rgba(45, 108, 223, 0.1);
      flex-shrink: 0;
      font-weight: 700;
    }

    .search-box input {
      width: 100%;
      border: 0;
      background: transparent;
      outline: 0;
      color: var(--text);
      font-size: 15px;
    }

    .search-results-card {
      margin-bottom: 22px;
    }

    .search-results-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .search-group {
      padding: 16px;
      border-radius: 20px;
      background: rgba(240, 245, 250, 0.58);
      border: 1px solid rgba(102, 125, 156, 0.12);
    }

    .search-group h4 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .search-list {
      display: grid;
      gap: 10px;
    }

    .search-result-item {
      width: 100%;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(102, 125, 156, 0.12);
      background: rgba(255, 255, 255, 0.98);
      text-align: left;
    }

    .search-result-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .search-result-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .search-result-item strong {
      display: block;
      margin-bottom: 4px;
    }

    .search-result-item p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .nav-row {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }

    .nav-pill {
      --nav-accent: #ff8359;
      --nav-rgb: 255, 131, 89;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 15px;
      background: linear-gradient(180deg, rgba(var(--nav-rgb), 0.12), rgba(var(--nav-rgb), 0.08));
      border: 1px solid rgba(var(--nav-rgb), 0.18);
      color: var(--nav-accent);
      box-shadow: 0 12px 24px rgba(var(--nav-rgb), 0.1);
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .nav-pill:hover,
    .nav-pill[data-active="true"] {
      transform: translateY(-1px);
      border-color: rgba(var(--nav-rgb), 0.3);
      background: linear-gradient(180deg, rgba(var(--nav-rgb), 0.2), rgba(var(--nav-rgb), 0.12));
      box-shadow: 0 14px 28px rgba(var(--nav-rgb), 0.18);
    }

    .nav-pill strong {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 19px;
      height: 19px;
      font-size: 18px;
      line-height: 1;
    }

    .nav-pill svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-pill[data-action="go-home"] {
      --nav-accent: #ff7d5c;
      --nav-rgb: 255, 125, 92;
    }

    .nav-pill[data-action="open-friends"] {
      --nav-accent: #2d8cff;
      --nav-rgb: 45, 140, 255;
    }

    .nav-pill[data-action="open-reels"] {
      --nav-accent: #ff4fb0;
      --nav-rgb: 255, 79, 176;
    }

    .nav-pill[data-action="open-marketplace"] {
      --nav-accent: #19b889;
      --nav-rgb: 25, 184, 137;
    }

    .nav-pill[data-action="toggle-notifications"] {
      --nav-accent: #ff9f43;
      --nav-rgb: 255, 159, 67;
    }

    .nav-pill[data-action="toggle-chat"] {
      --nav-accent: #5b8cff;
      --nav-rgb: 91, 140, 255;
    }

    .nav-pill[data-action="open-admin"] {
      --nav-accent: #8c6cff;
      --nav-rgb: 140, 108, 255;
    }

    .nav-pill[data-action="open-profile"] {
      --nav-accent: #5f9bff;
      --nav-rgb: 95, 155, 255;
    }

    .badge {
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--brand);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .shell {
      max-width: 1240px;
      margin: 0 auto;
      padding: 24px 18px 48px;
    }

    .hero-card {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 16px;
      align-items: center;
      padding: 22px;
      margin-bottom: 22px;
      border-radius: var(--radius-xl);
      background:
        linear-gradient(135deg, rgba(255, 111, 97, 0.94), rgba(45, 108, 223, 0.92));
      color: #fff;
      box-shadow: 0 24px 40px rgba(45, 108, 223, 0.2);
    }

    .hero-copy h2 {
      margin: 0 0 8px;
      font-size: 34px;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .hero-copy p {
      margin: 0;
      max-width: 560px;
      color: rgba(255, 255, 255, 0.9);
    }

    .hero-metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .metric {
      padding: 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(6px);
    }

    .metric-value {
      font-size: 26px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 6px;
    }

    .metric-label {
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(280px, 360px);
      gap: 24px;
      align-items: start;
    }

    .card {
      position: relative;
      background: var(--card);
      border: 1px solid rgba(112, 137, 170, 0.16);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .card-pad {
      padding: 20px;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .card-title-row h3 {
      margin: 0;
      font-size: 19px;
    }

    .small-copy {
      color: var(--muted);
      font-size: 13px;
    }

    .composer-card {
      margin-bottom: 20px;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    .composer-card.is-focused {
      transform: translateY(-1px);
      box-shadow: 0 26px 48px rgba(255, 111, 97, 0.12);
    }

    .composer-top {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 14px;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: linear-gradient(135deg, #f7b55f, #ff6f61);
    }

    .composer-meta strong,
    .post-author strong,
    .friend-name,
    .product-name {
      display: block;
      font-size: 15px;
    }

    .name-with-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .profile-link-button {
      display: inline-flex;
      align-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: opacity 0.18s ease;
    }

    .profile-link-button:hover {
      opacity: 0.78;
    }

    .verified-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      background: #0095f6;
      color: #fff;
      font-size: 9px;
      font-weight: 900;
      line-height: 1;
      clip-path: polygon(50% 0%, 64% 8%, 78% 4%, 88% 16%, 98% 28%, 94% 42%, 100% 50%, 94% 58%, 98% 72%, 88% 84%, 78% 96%, 64% 92%, 50% 100%, 36% 92%, 22% 96%, 12% 84%, 2% 72%, 6% 58%, 0% 50%, 6% 42%, 2% 28%, 12% 16%, 22% 4%, 36% 8%);
      box-shadow: 0 4px 10px rgba(0, 149, 246, 0.24);
      transform: translateY(-1px);
    }

    .composer-meta span,
    .post-author span {
      color: var(--muted);
      font-size: 13px;
    }

    .composer-form textarea,
    .inline-input,
    .inline-textarea {
      width: 100%;
      border: 1px solid rgba(102, 125, 156, 0.22);
      border-radius: 18px;
      outline: 0;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.96);
      color: var(--text);
      resize: vertical;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .composer-form textarea {
      min-height: 120px;
      margin-bottom: 12px;
    }

    .composer-form textarea:focus,
    .inline-input:focus,
    .inline-textarea:focus {
      border-color: rgba(255, 111, 97, 0.46);
      box-shadow: 0 0 0 4px rgba(255, 111, 97, 0.09);
    }

    .composer-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .composer-tool {
      min-height: 42px;
      padding: 0 14px;
      border-radius: 14px;
      background: rgba(240, 245, 250, 0.92);
      color: var(--text);
      border: 1px solid rgba(102, 125, 156, 0.14);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .composer-tool[data-active="true"] {
      background: rgba(255, 111, 97, 0.14);
      border-color: rgba(255, 111, 97, 0.28);
      color: var(--brand-dark);
    }

    .composer-extra-panels {
      display: grid;
      gap: 10px;
      margin-bottom: 12px;
    }

    .composer-extra {
      display: none;
    }

    .composer-extra[data-open="true"] {
      display: block;
    }

    .composer-actions,
    .modal-actions,
    .comment-form {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .inline-input {
      min-height: 50px;
      flex: 1 1 240px;
    }

    .inline-textarea {
      min-height: 110px;
    }

    .button-primary,
    .button-soft,
    .button-outline {
      min-height: 46px;
      padding: 0 16px;
      border-radius: 14px;
      font-weight: 700;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .button-primary {
      color: #fff;
      background: linear-gradient(135deg, var(--brand), #ff8c55);
      box-shadow: 0 12px 24px rgba(255, 111, 97, 0.22);
    }

    .button-primary:hover,
    .button-soft:hover,
    .button-outline:hover,
    .action-button:hover,
    .story:hover,
    .product-card:hover,
    .friend-card:hover,
    .notification-item:hover {
      transform: translateY(-1px);
    }

    .button-soft {

    const STORAGE_KEY = "allnect-auth-v2";

    if (!userData) {
